name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  # Opens/updates the release PR on every push to main. Merging that PR creates
  # the tag and GitHub release, which triggers the build job below.
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release

  build:
    needs: release-please
    # Run for a new release, or manually (test build uploaded as workflow artifacts)
    if: always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch')
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: appimage,deb,rpm
          - platform: macos-latest
            bundles: dmg
          - platform: windows-latest
            bundles: nsis,msi

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and upload
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBKIT_DISABLE_COMPOSITING_MODE: ${{ matrix.platform == 'ubuntu-22.04' && '1' || '' }}
        with:
          projectPath: apps/desktop
          # Empty tag on manual runs → build only, no release upload
          tagName: ${{ needs.release-please.outputs.tag_name }}
          releaseDraft: false
          uploadWorkflowArtifacts: ${{ github.event_name == 'workflow_dispatch' }}
          args: --bundles ${{ matrix.bundles }}
