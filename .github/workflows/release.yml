name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create as draft release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            bundles: appimage,deb,rpm
          - platform: macos-latest
            bundles: dmg
          - platform: windows-latest
            bundles: nsis,msi

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WEBKIT_DISABLE_COMPOSITING_MODE: ${{ matrix.platform == 'ubuntu-22.04' && '1' || '' }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'Fablesheet ${{ github.ref_name }}'
          releaseBody: |
            ## Fablesheet ${{ github.ref_name }}

            Offline-first character manager for 5th edition tabletop RPGs.

            See [CHANGELOG.md](https://github.com/fablesheet/fablesheet/blob/main/CHANGELOG.md) for what changed.

            ### Installation

            **Windows** — download the `.msi` or `.exe` installer.
            > SmartScreen may warn "Windows protected your PC" — click **More info → Run anyway**.
            > The installer will set up WebView2 automatically if it is not already present.

            **macOS** — download the `.dmg`, open it, and drag the app to Applications.
            > Gatekeeper may block an unsigned app. If you see _"cannot be opened"_, right-click the app and choose **Open**, then confirm. Alternatively run in a terminal: `xattr -d com.apple.quarantine /Applications/Fablesheet.app`

            **Linux**
            - `.AppImage` — runs on most distros. Make it executable first: `chmod +x Fablesheet_*.AppImage && ./Fablesheet_*.AppImage`
              - **Arch / EndeavourOS / Manjaro**: AppImages need FUSE 2 — run `sudo pacman -S fuse2` once, then launch normally. Alternatively: `APPIMAGE_EXTRACT_AND_RUN=1 ./Fablesheet_*.AppImage`
            - `.deb` — Debian / Ubuntu: `sudo dpkg -i Fablesheet_*.deb`
            - `.rpm` — Fedora / openSUSE: `sudo rpm -i Fablesheet_*.rpm`
          releaseDraft: ${{ github.event.inputs.draft || 'true' }}
          prerelease: false
          args: --bundles ${{ matrix.bundles }}
